    <path d="M40 70 L50 62 L60 70 L70 62 L80 70 L80 75 L40 75 Z" fill="#4FC3F7" />
    <path d="M60 42 C54 48 48 55 46 62 C50 60 56 62 60 67 C64 62 70 60 74 62 C72 55 66 48 60 42 Z" fill="#FFFFFF" stroke="#0288D1" stroke-width="2" />
