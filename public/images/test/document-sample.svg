    <path d="M98 65 C100 40 85 24 70 18" stroke="#2E7D32" stroke-width="5" stroke-linecap="round" fill="none" />
    <polygon points="60,10 63,16 70,16 65,20 67,27 60,23 53,27 55,20 50,16 57,16" fill="#0288D1" stroke="#FBC02D" stroke-width="1" />
