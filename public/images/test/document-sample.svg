  </g>

  <!-- Ministry Title Block -->
  <g font-family="sans-serif" text-anchor="middle" fill="#111827">
    <text x="470" y="82" font-size="11" font-weight="700">O‘ZBEKISTON RESPUBLIKASI</text>
    <text x="470" y="98" font-size="11" font-weight="700">IQTISODIYOT VA MOLIYA VAZIRLIGI</text>
    <text x="470" y="114" font-size="10" font-weight="700">HUZURIDAGI</text>
    <text x="470" y="130" font-size="11" font-weight="700">JAHON BANKI VA OSIYO INFRATUZILMAVIY</text>
    <text x="470" y="146" font-size="11" font-weight="700">INVESTITSIYALAR BANKI ISHTIROKIDAGI</text>
    <text x="470" y="162" font-size="11" font-weight="700">“O‘RTA SHAHARLARNI KOMPLEKS RIVOJLANTIRISH”</text>
    <text x="470" y="178" font-size="11" font-weight="700">LOYIHASINI AMALGA OSHIRISH GURUHI</text>
    <text x="470" y="196" font-size="9" fill="#6B7280">100017, Toshkent sh., Taras Shevchenko ko‘chasi, 34-uy, Tel.: (998 71) 252-42-20</text>
    <text x="470" y="210" font-size="9" fill="#2563EB">www.imv.uz, info@imv.uz, E-mail: mscuzb@gmail.com, grpmift@exat.uz</text>
  </g>

  <!-- Divider -->
  <line x1="60" y1="225" x2="740" y2="225" stroke="#111827" stroke-width="1.5" />

  <!-- Date and Number -->
  <g font-family="sans-serif" font-size="13" font-weight="600" fill="#111827">
    <text x="60" y="255">2026 y. “9” sentabr</text>
    <text x="740" y="255" text-anchor="end">02/77-01-02-573-son</text>
  </g>

  <!-- Receiver Block -->
  <g font-family="sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">
    <text x="560" y="300">“O‘zbekiston Temir yo‘llari”</text>
    <text x="560" y="320">boshqaruv raisi</text>
    <text x="560" y="340">Z. G‘. Narzullayevga</text>
  </g>

  <!-- Salutation -->
  <text x="60" y="390" font-family="sans-serif" font-size="14" font-weight="600" fill="#111827">
    Hurmatli Zufar G‘iyasovich,
  </text>

  <!-- Paragraph 1 -->
  <g font-family="sans-serif" font-size="13" fill="#1F2937">
    <text x="90" y="425">O‘zbekiston Respublikasi Prezidentining 2024-yil 31-yanvardagi “Xalqaro taraqqiyot uyushmasi va Osiyo</text>
    <text x="60" y="447">infratuzilmaviy investitsiyalar banki ishtirokida “O‘rta shaharlarni kompleks rivojlantirish” loyihasini amalga</text>
    <text x="60" y="469">oshirishga doir chora-tadbirlar to‘g‘risida”gi PQ-47-son qaroriga muvofiq, Surxondaryo viloyatining Jarqo‘rg‘on</text>
    <text x="60" y="491">tumanida ichimlik suv tarmoqlarini qurish va rekonstruksiya qilish ishlari belgilangan.</text>

    <!-- Paragraph 2 -->
    <text x="90" y="530">Mazkur loyiha doirasida hozirgi kunda Jarqo‘rg‘on tumanida ichimlik suv tarmoqlarini loyihalashtirish ishlari</text>
    <text x="60" y="552">amalga oshirilmoqda.</text>

    <!-- Paragraph 3 -->
    <text x="90" y="590">Yuqoridagilardan kelib chiqib, Jarqo‘rg‘on tumanida ichimlik suv tarmoqlarini temir yo‘l kesishuvidan o‘tkazish</text>
    <text x="60" y="612">bo‘yicha texnik shartlarni taqdim etishingizni so‘raymiz.</text>

    <!-- Paragraph 4 -->
    <text x="90" y="650">Loyiha doirasida temir yo‘l izlari ostidan o‘tkaziladigan barcha muhandislik tarmoqlari amaldagi shaharsozlik</text>
    <text x="60" y="672">normalari va temir yo‘l xavfsizligi talablariga to‘liq javob berishi kafolatlanadi. Trassa yo‘nalishi bo‘yicha</text>
    <text x="60" y="694">topografik xaritalar va muhandislik-geologik qidiruv materiallari ilova qilinmoqda.</text>

    <!-- Attachment -->
    <text x="90" y="735" font-weight="600">Ilova: Loyiha taklifi va chizmalari 12 varaqda.</text>
  </g>

  <!-- Signature Section -->
  <line x1="60" y1="810" x2="740" y2="810" stroke="#E5E7EB" stroke-dasharray="4 4" />

  <text x="60" y="855" font-family="sans-serif" font-size="13" font-weight="600" fill="#111827">
    Loyiha guruhi direktori
  </text>

